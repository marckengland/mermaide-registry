name: Report a package
description: Report a package version for maintainer investigation.
title: 'Package report: '
body:
  - type: markdown
    attributes:
      value: 'Do not post credentials, private source, or working exploits. Use private vulnerability reporting for security disclosures.'
  - type: input
    id: package
    attributes:
      label: Publisher/name and exact version
    validations:
      required: true
  - type: input
    id: digest
    attributes:
      label: Archive SHA-256, if available
  - type: textarea
    id: reason
    attributes:
      label: What happened?
      description: Include safe reproduction steps and the expected behavior.
    validations:
      required: true
