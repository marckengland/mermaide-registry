name: Inspect package proposals
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Download data only using trusted base-branch tooling
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node registry-tool.mjs fetch-pr --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/proposal" --pr "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Read existing signed history with read-only authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node registry-tool.mjs previous --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/previous" --receipt "$RUNNER_TEMP/scan-state.json"
      - name: Scan exact proposal bytes without executing package code
        run: |
          if test -d "$RUNNER_TEMP/previous"; then
            node registry-tool.mjs scan --source "$RUNNER_TEMP/proposal" --previous "$RUNNER_TEMP/previous"
          else
            node registry-tool.mjs scan --source "$RUNNER_TEMP/proposal"
          fi
